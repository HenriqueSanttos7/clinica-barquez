<section class="not-found">
  <div class="not-found__container container">
    <div class="not-found__content">
      <span class="not-found__eyebrow">Página não encontrada</span>

      <div class="not-found__code" aria-hidden="true">404</div>

      <h1 class="not-found__title">Parece que você chegou a um lugar que não existe.</h1>

      <div class="not-found__divider" aria-hidden="true">
        <span></span>
        <span>✦</span>
      </div>

      <p class="not-found__description">
        A página que você tentou acessar pode ter sido removida, renomeada ou o endereço informado
        está incorreto.
      </p>

      <div class="not-found__actions">
        <a class="not-found__button not-found__button--primary" routerLink="/">
          <i class="fa-solid fa-house" aria-hidden="true"></i>
          Voltar ao início
        </a>

        <a class="not-found__button not-found__button--outline" routerLink="/contato">
          <i class="fa-regular fa-envelope" aria-hidden="true"></i>
          Fale conosco
        </a>
      </div>
    </div>
  </div>
</section>
