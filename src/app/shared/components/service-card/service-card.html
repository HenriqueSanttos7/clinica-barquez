<article
  class="service-card"
  [class.service-card--compact]="compact"
  [class.service-card--active]="active"
>
  <!-- Imagem do serviço no topo -->
  <div class="service-card__image-wrapper">
    <img [src]="service.imagem" [alt]="service.nome" class="service-card__image" loading="lazy" />
  </div>

  <div class="service-card__content">
    <h3 class="service-card__title">{{ service.nome }}</h3>

    @if (!compact) {
      <p class="service-card__description">
        {{ service.resumo || service.subtitulo }}
      </p>
    }

    <a
      [routerLink]="['/servicos', service.id]"
      class="service-card__link"
      [attr.aria-label]="'Ver detalhes de ' + service.nome"
    >
      <span>{{ compact ? 'Ver especialidade' : 'Saiba mais' }}</span>
      <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
    </a>
  </div>
</article>
